[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsv41-train"
version = "0.1.0"
description = "Native PyTorch training for DeepSeek V4.1 and Qwen3 MoE models"
requires-python = ">=3.10"
dependencies = [
  "jinja2>=3.1",
  "numpy>=1.24",
  "tokenizers>=0.22",
  "tomli>=2; python_version < '3.11'",
  "torch>=2.4",
  "transformers>=4.57.6,<6",
]

[project.optional-dependencies]
rollout-vllm = ["vllm==0.31.0"]
rollout-datasets = ["pyarrow>=15"]
rollout-report = ["matplotlib>=3.7"]
rollout-terminal = ["harbor @ git+https://github.com/harbor-framework/harbor.git@3c82380859d187957cfd5cd64802b076d9779550 ; python_version >= '3.12'"]

[project.scripts]
rollout-manager = "rollout_manager.cli:main"

[tool.setuptools.packages.find]
include = ["dsv41_train*", "rollout_manager*"]

[tool.setuptools.package-data]
dsv41_train = ["models/*/*.json"]
rollout_manager = ["data/*.json"]
"rollout_manager.terminal_bench" = ["data/*.json"]
"rollout_manager.terminal_bench.browser_relay" = ["relay.html"]
