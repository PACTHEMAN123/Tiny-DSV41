[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsv41-train"
version = "0.1.0"
description = "Native PyTorch training for DeepSeek V4.1 and Qwen3 MoE models"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "tokenizers>=0.22",
  "torch>=2.4",
]

[tool.setuptools.packages.find]
include = ["dsv41_train*"]

[tool.setuptools.package-data]
dsv41_train = ["models/*/*.json"]
